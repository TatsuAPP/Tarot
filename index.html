<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タロット</title>
<meta name="theme-color" content="#16264A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16264A;      /* 背景の濃い藍 */
  --night-2:#101B36;
  --blue:#2B4B8C;       /* カードの裏 */
  --gold:#E3B23C;
  --gold-dim:#A8801F;
  --paper:#F3E7C8;      /* カードの表と本文 */
  --paper-dim:#BFAC7C;
  --ink:#16110D;
}
*{box-sizing:border-box}
body{
  margin:0 auto;
  max-width:560px;
  min-height:100vh;
  padding:28px 18px calc(40px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--night),var(--night-2)) fixed;
  color:var(--paper);
  font-family:"Shippori Mincho B1", serif;
  -webkit-font-smoothing:antialiased;
}

/* ---- 見出し ---- */
h1{margin:0 0 6px;font-size:30px;letter-spacing:.28em;text-indent:.28em}
.lede{margin:0 0 24px;font-size:13px;line-height:1.8;color:var(--paper-dim)}

/* ---- ボタン共通 ---- */
button{font-family:inherit;cursor:pointer;border-radius:2px;touch-action:manipulation}
.outline{background:transparent;color:var(--paper);border:1px solid rgba(191,172,124,.45)}
.filled{background:var(--gold);color:var(--night);border:1px solid var(--gold);font-weight:700}

.modes{display:flex;gap:8px;margin-bottom:26px}
.modes button{flex:1;padding:11px 4px;font-size:13.5px;letter-spacing:.06em}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:-16px 0 26px}
.categories button{flex:1 1 28%;padding:9px 4px;font-size:12.5px;letter-spacing:.04em}
.archive-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.archive-item{display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 14px;font-size:13.5px;text-align:left;letter-spacing:.04em}
.archive-item .date{flex:none;font-size:11px;color:var(--gold-dim);letter-spacing:.04em}
.actions{display:flex;gap:10px;margin-top:26px}
.actions button{flex:1;padding:13px 6px;font-size:14px;letter-spacing:.08em}

.sound{
  position:absolute;top:26px;right:16px;
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;padding:0;border-radius:50%;
  color:var(--gold);border-color:rgba(227,178,60,.7);
}
.sound svg{width:19px;height:19px}
.sound.muted{color:var(--paper-dim);border-color:rgba(191,172,124,.4)}

/* ---- 山札 ---- */
.stage{text-align:center}
.deck{position:relative;width:132px;height:210px;margin:8px auto 22px;padding:0;background:none;border:0}
.deck:disabled{opacity:.4;cursor:default}
.deck span{position:absolute;inset:0;display:block;border:1.5px solid var(--gold-dim);border-radius:6px;background:var(--blue)}
.deck span:nth-child(1){transform:translate(-7px,6px) rotate(-4deg);opacity:.5}
.deck span:nth-child(2){transform:translate(4px,3px) rotate(3deg);opacity:.75}
.deck span:nth-child(3){overflow:hidden}
.hint{font-size:14px;letter-spacing:.1em;color:var(--gold)}

/* ---- 引いたカード ---- */
.row{display:flex;justify-content:center;gap:10px;margin:4px 0 22px}
.slot{flex:1;max-width:150px}
.pos{margin-bottom:7px;font-size:11.5px;letter-spacing:.14em;color:var(--paper-dim)}
.card{display:block;width:100%;aspect-ratio:2/3.3;padding:0;background:none;border:0;perspective:900px}
.card span{display:block}          /* ボタンの中身は既定で横並びなので縦積みに直す */
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.7,.25,1)}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;border:1.5px solid var(--gold-dim);border-radius:5px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:var(--blue)}
.front{
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:8px 5px 7px;transform:rotateY(180deg);
  background:var(--paper);color:var(--ink);
}
.front.reversed .emblem{transform:rotate(180deg)}
.numeral{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gold-dim)}
.emblem{width:74%;max-height:56%}
.cname{font-size:12.5px;font-weight:700;line-height:1.35;text-align:center}
.orient{margin-top:2px;font-size:10.5px;color:#6A5F4C}

/* ---- 読み ---- */
.entry{padding:16px 0 4px;border-top:1px solid rgba(191,172,124,.35)}
.entry h2{margin:0 0 3px;font-size:17px;color:var(--gold)}
.entry .meta{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;color:var(--paper-dim)}
.entry p{margin:0;font-size:14.5px;line-height:1.95}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  padding:9px 18px;border-radius:2px;
  background:var(--paper);color:var(--ink);font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){ .inner{transition:none} }
</style>
</head>
<body>

<button class="sound outline" id="sound" aria-label="音を消す">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M4 9v6h4l5 4V5L8 9z"/>
    <g id="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
    <path id="slash" d="M17 9l5 6M22 9l-5 6" hidden/>
  </svg>
</button>

<h1>タロット</h1>

  カードを引いて、いまの自分を読む。<br>
  【今日の一枚】は、今日という一日へのメッセージ。<br>
  運命のささやきが、あなたの一日を映します。<br><br>

  【三枚引き】では、3枚のカードからあなたの悩みや状況を読み解きます。<br>
  心に問いかけてください。3枚のカードが映し出す、未来の兆しを。
</p>

<div class="modes">
  <button class="filled" data-count="1" aria-pressed="true">今日の一枚</button>
  <button class="outline" data-count="3" aria-pressed="false">三枚引き</button>
  <button class="outline" id="archiveBtn" aria-pressed="false">アーカイブ</button>
</div>

<div class="categories" id="categories" hidden>
  <button class="outline" data-category="love" aria-pressed="false">恋愛運</button>
  <button class="outline" data-category="work" aria-pressed="false">仕事運</button>
  <button class="outline" data-category="money" aria-pressed="false">金運</button>
  <button class="outline" data-category="relationship" aria-pressed="false">対人運</button>
  <button class="outline" data-category="health" aria-pressed="false">健康運</button>
</div>

<div class="stage" id="stage">
  <button class="deck" id="deck" aria-label="カードを引く"><span></span><span></span><span></span></button>
  <p class="hint" id="hint">タップして引く</p>
</div>

<div id="archive" hidden>
  <p class="hint" id="archiveEmpty" hidden>まだ記録がありません</p>
  <div class="archive-list" id="archiveList"></div>
</div>

<div class="row" id="row" hidden></div>
<div id="reading"></div>

<div class="actions" id="actions" hidden>
  <button class="outline" id="again">もう一度引く</button>
  <button class="filled" id="share">結果をシェア</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const POSITIONS = ['過去','現在','未来'];

/* カードの裏の絵は全部同じなので一度だけ作る */
const BACK_SVG = `<svg viewBox="0 0 100 160" width="100%" height="100%" aria-hidden="true">
  <rect x="6" y="6" width="88" height="148" fill="none" stroke="#E3B23C" stroke-width="1.2"/>
  <g stroke="#E3B23C" stroke-width=".8" opacity=".65" fill="none">
    <path d="M50 20v120M18 80h64M22 40l56 80M78 40L22 120"/>
    <circle cx="50" cy="80" r="26"/><circle cx="50" cy="80" r="13"/>
  </g>
  <path d="M50 66l3.6 9.6 10.4.5-8.1 6.5 2.8 10-8.7-5.7-8.7 5.7 2.8-10-8.1-6.5 10.4-.5z" fill="#E3B23C"/>
</svg>`;

/* ============================================================
   2. 音（すべてその場で合成。音声ファイルは使わない）
   ============================================================ */
const sound = (() => {
  let audio;              /* AudioContext（オーディオコンテキスト）＝音を作る土台 */
  let master, music, sfx; /* sfx ＝ sound effects の略。効果音の音量つまみ */
  let noiseBuffer;        /* ザーというノイズの素 */
  let muted = false;

  /* 音量つまみを1つ作って、つなぎ先へ配線する */
  function gain(value, target){
    const node = audio.createGain();
    node.gain.value = value;
    node.connect(target);
    return node;
  }

  /* LFO（エルエフオー＝低周波発振器）。目に見えない速さで値をゆっくり揺らす担当 */
  function wobble(rate, depth, target){
    const osc = audio.createOscillator();
    osc.frequency.value = rate;
    osc.connect(gain(depth, target));
    osc.start();
  }

  /* 音量の山を描く。無音→peak→無音 */
  function envelope(target, at, peak, attack, duration){
    const node = audio.createGain();
    node.gain.setValueAtTime(0.0001, at);
    node.gain.exponentialRampToValueAtTime(peak, at + attack);
    node.gain.exponentialRampToValueAtTime(0.0001, at + duration);
    node.connect(target);
    return node;
  }

  function noiseSource(){
    if (!noiseBuffer){
      noiseBuffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = audio.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    return src;
  }

  /* 低く漂うBGM。低い音を5つ重ね、それぞれ別の速さで揺らす */
  function startAmbient(){
    const lowPass = audio.createBiquadFilter();   /* 高い成分を削って丸くする */
    lowPass.type = 'lowpass';
    lowPass.frequency.value = 520;
    lowPass.connect(music);
    wobble(0.045, 220, lowPass.frequency);

    const volumes = [0.16, 0.12, 0.08, 0.05, 0.03];
    [73.42, 110, 146.83, 220, 293.66].forEach((hz, i) => {
      const osc = audio.createOscillator();      /* osc ＝ oscillator の略。音の発振器 */
      osc.type = i > 2 ? 'sine' : 'triangle';
      osc.frequency.value = hz;
      osc.detune.value = i % 2 ? 6 : -6;         /* わずかにずらして唸りを出す */
      const volume = gain(volumes[i], lowPass);
      osc.connect(volume);
      osc.start();
      wobble(0.03 + i * 0.017, volumes[i] * 0.55, volume.gain);
    });

    const bandPass = audio.createBiquadFilter(); /* 風の音にする帯域フィルタ */
    bandPass.type = 'bandpass';
    bandPass.frequency.value = 420;
    bandPass.Q.value = 0.8;
    const windVolume = gain(0.035, music);
    noiseSource().connect(bandPass).connect(windVolume);
    wobble(0.07, 0.022, windVolume.gain);
  }

  /* 最初のタップで起動する。それ以前は鳴らせない決まりがある */
  function start(){
    if (audio) return;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    audio = new Ctor();
    master = gain(muted ? 0 : 1, audio.destination);
    music = gain(0.0001, master);
    sfx = gain(0.9, master);
    startAmbient();
    music.gain.exponentialRampToValueAtTime(0.13, audio.currentTime + 6);
  }

  /* 紙が擦れる音。ノイズの通り道を高い方から低い方へ振る */
  function swish(duration, from, to, peak){
    if (!audio) return;
    const at = audio.currentTime;
    const bandPass = audio.createBiquadFilter();
    bandPass.type = 'bandpass';
    bandPass.Q.value = 1.1;
    bandPass.frequency.setValueAtTime(from, at);
    bandPass.frequency.exponentialRampToValueAtTime(to, at + duration);
    const src = noiseSource();
    src.connect(bandPass).connect(envelope(sfx, at, peak, duration * 0.22, duration));
    src.start(at);
    src.stop(at + duration + 0.05);
  }

  /* 澄んだ一音。基本の音に、その倍音をほんの少し足す */
  function bell(hz, delay, peak, duration){
    if (!audio) return;
    const at = audio.currentTime + delay;
    [[1, 'triangle', peak], [2.01, 'sine', peak * 0.3]].forEach(([ratio, type, level]) => {
      const osc = audio.createOscillator();
      osc.type = type;
      osc.frequency.value = hz * ratio;
      osc.connect(envelope(sfx, at, level, 0.012, duration));
      osc.start(at);
      osc.stop(at + duration + 0.05);
    });
  }

  const SCALE = [220, 261.63, 293.66, 349.23, 392, 440, 523.25];

  return {
    shuffle(){
      start();
      swish(0.34, 2200, 400, 0.26);
      swish(0.30, 1600, 300, 0.20);
      setTimeout(() => swish(0.26, 1900, 360, 0.22), 130);
    },
    flip(index){
      swish(0.16, 2600, 700, 0.22);
      bell(SCALE[index % SCALE.length], 0.05, 0.16, 2.2);
    },
    finish(){
      bell(392, 0, 0.14, 2.6);
      bell(587.33, 0.16, 0.11, 3);
    },
    toggleMute(){
      muted = !muted;
      if (audio) master.gain.setTargetAtTime(muted ? 0 : 1, audio.currentTime, 0.15);
      return muted;
    }
  };
})();

/* ============================================================
   3. 画面の動き
   ============================================================ */
let count = 1;    /* 一度に引く枚数。1 か 3 */
let drawn = [];   /* 引いたカード。{card, reversed} の配列 */

$('deck').querySelector('span:nth-child(3)').innerHTML = BACK_SVG;

/* この端末だけの乱数。一度作ったらlocalStorageに保存して、以後はずっと同じ値を使う。
   これがないと種が日付だけになり、全員が同じ日に同じカードを引いてしまう */
function deviceSeed(){
  const key = 'tarotDeviceSeed';
  try {
    let value = localStorage.getItem(key);
    if (!value){
      value = String(Math.floor(Math.random() * 1e9));
      localStorage.setItem(key, value);
    }
    return Number(value);
  } catch {
    /* プライベートブラウズ等でlocalStorageが使えない場合は毎回作る（同日再現はできない） */
    return Math.floor(Math.random() * 1e9);
  }
}

/* 指定した日（省略時は今日）＋端末ごとの乱数を組み合わせた種。
   同じ端末・同じ日なら同じ数字 → 同じカードが出る。端末が違えば数字も変わる。
   offsetを変えると（三枚引きのカテゴリのように）同じ日・同じ端末でも別系統の乱数になる。
   dateを過去の日付にすれば、その日に出たのと同じカードを後から再現できる */
const dailySeed = (offset = 0, date = new Date()) => {
  const dateNumber = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
  return dateNumber * 1000003 + deviceSeed() + offset;
};

const dateKey = (date = new Date()) =>
  `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

/* 三枚引きのカテゴリ。選んだカテゴリごとに種のoffsetを変えて、
   今日の一枚（offset 0）とも他のカテゴリとも違う結果にする */
const CATEGORIES = [
  { id: 'love',         label: '恋愛' },
  { id: 'work',         label: '仕事' },
  { id: 'money',        label: '金'   },
  { id: 'relationship', label: '対人' },
  { id: 'health',       label: '健康' }
];
let selectedCategory = null;

/* ---- 引いた記録（アーカイブ用） ----
   カードの中身は保存せず「いつ・何を引いたか」だけを覚えておく。
   表示するときはdailySeedで同じ日付から同じカードを計算し直す */
const HISTORY_KEY = 'tarotHistory';

function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}

function recordDraw(entry){
  const history = loadHistory();
  const already = history.some(e =>
    e.date === entry.date && e.count === entry.count && e.category === entry.category);
  if (already) return;
  history.unshift(entry);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
}

/* 種（seed＝シード）から同じ並びの乱数を作る。渡す種が同じなら結果も毎回同じ */
function seededRandom(seed){
  let state = seed % 2147483647;
  if (state <= 0) state += 2147483646;
  const next = () => (state = state * 16807 % 2147483647) / 2147483647;
  /* 種が1違うだけだと最初の数回はほぼ同じ値になる。日付は1日で1しか増えないので、
     ここで空回しして種の差を広げてから使う */
  for (let i = 0; i < 12; i++) next();
  return next;
}

let viewingArchive = false; /* trueの間は「もう一度引く」がアーカイブ一覧に戻るボタンになる */

function reset(){
  drawn = [];
  viewingArchive = false;
  $('row').hidden = true;
  $('row').innerHTML = '';
  $('reading').innerHTML = '';
  $('actions').hidden = true;
  $('archive').hidden = true;
  $('stage').hidden = false;
  if (count === 1){
    $('hint').textContent = 'タップして引く';
    $('deck').disabled = false;
  } else if (!selectedCategory){
    $('hint').textContent = 'カテゴリを選んでください';
    $('deck').disabled = true;
  } else {
    $('hint').textContent = 'タップして三枚引く';
    $('deck').disabled = false;
  }
}

/* offsetと日付から、その条件で出るはずのカードを計算する。
   カードそのものは保存せず、この計算で毎回同じ結果を再現する */
function computeCards(offset, date){
  const random = seededRandom(dailySeed(offset, date));
  const remaining = [...DECK];
  const result = [];
  for (let i = 0; i < count; i++){
    const picked = remaining.splice(Math.floor(random() * remaining.length), 1)[0];
    result.push({ card: picked, reversed: random() < 0.4 });
  }
  return result;
}

function renderRow(){
  $('stage').hidden = true;
  $('archive').hidden = true;
  $('row').hidden = false;
  $('reading').innerHTML = '';
  $('row').innerHTML = drawn.map(({card, reversed}, i) => `
    <div class="slot">
      ${count === 3 ? `<div class="pos">${POSITIONS[i]}</div>` : ''}
      <button class="card" data-index="${i}" aria-label="カードをめくる">
        <span class="inner">
          <span class="face back">${BACK_SVG}</span>
          <span class="face front ${reversed ? 'reversed' : ''}">
            <span class="numeral">${card.num}</span>
            <svg viewBox="0 0 100 100" class="emblem" aria-hidden="true" fill="none" stroke="#16110D"
                 stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${EMBLEMS[card.emblem]}</svg>
            <span>
              <span class="cname">${card.name}</span>
              <span class="orient">${reversed ? '逆位置' : '正位置'}</span>
            </span>
          </span>
        </span>
      </button>
    </div>`).join('');
  $('actions').hidden = false;
  $('again').textContent = viewingArchive ? 'アーカイブへ戻る' : 'もう一度引く';
}

function drawCards(){
  /* offset 0＝今日の一枚、1以降＝三枚引きの各カテゴリ。どちらも「同じ日・同じ端末（・同じカテゴリ）
     なら同じ結果」になる種を使うので、カテゴリを選んだ日はそのカードしか出ない */
  const offset = count === 1 ? 0 : 1 + CATEGORIES.findIndex(c => c.id === selectedCategory);
  drawn = computeCards(offset, new Date());
  recordDraw({ date: dateKey(), count, category: count === 3 ? selectedCategory : null });
  viewingArchive = false;
  renderRow();
}

function showArchiveList(){
  drawn = [];
  viewingArchive = false;
  $('stage').hidden = true;
  $('row').hidden = true;
  $('row').innerHTML = '';
  $('reading').innerHTML = '';
  $('actions').hidden = true;
  $('archive').hidden = false;

  const history = loadHistory();
  $('archiveEmpty').hidden = history.length > 0;
  $('archiveList').innerHTML = history.map((entry, i) => {
    const label = entry.count === 1
      ? '今日の一枚'
      : `三枚引き・${CATEGORIES.find(c => c.id === entry.category)?.label ?? ''}`;
    return `<button class="outline archive-item" data-index="${i}">
      <span class="date">${entry.date}</span><span>${label}</span>
    </button>`;
  }).join('');
}

function openArchiveEntry(entry){
  count = entry.count;
  selectedCategory = entry.category;
  document.querySelectorAll('.categories button').forEach(button => {
    const selected = button.dataset.category === selectedCategory;
    button.className = selected ? 'filled' : 'outline';
    button.setAttribute('aria-pressed', selected);
  });
  const offset = entry.count === 1 ? 0 : 1 + CATEGORIES.findIndex(c => c.id === entry.category);
  const [y, m, d] = entry.date.split('-').map(Number);
  drawn = computeCards(offset, new Date(y, m - 1, d));
  viewingArchive = true;
  renderRow();
}

function openCard(button){
  if (button.classList.contains('open')) return;
  button.classList.add('open');

  const index = +button.dataset.index;
  const {card, reversed} = drawn[index];
  sound.flip(index);

  $('reading').insertAdjacentHTML('beforeend', `
    <div class="entry">
      <h2>${count === 3 ? POSITIONS[index] + '　' : ''}${card.name}</h2>
      <p class="meta">${card.num}　${card.en}　${reversed ? '逆位置' : '正位置'}</p>
      <p>${reversed ? card.rev : card.up}</p>
    </div>`);

  if ($('row').querySelectorAll('.card.open').length === drawn.length){
    setTimeout(() => sound.finish(), 700);
  }
}

function showToast(message){
  $('toast').textContent = message;
  $('toast').classList.add('show');
  setTimeout(() => $('toast').classList.remove('show'), 1800);
}

/* ---- ボタンの割り当て ---- */
function selectMode(button){
  document.querySelectorAll('.modes button').forEach(other => {
    const selected = other === button;
    other.className = selected ? 'filled' : 'outline';
    other.setAttribute('aria-pressed', selected);
  });
}

document.querySelectorAll('.modes button[data-count]').forEach(button => {
  button.onclick = () => {
    count = +button.dataset.count;
    selectMode(button);
    $('categories').hidden = count !== 3;
    reset();
  };
});

$('archiveBtn').onclick = () => {
  selectMode($('archiveBtn'));
  $('categories').hidden = true;
  showArchiveList();
};

document.querySelectorAll('.categories button').forEach(button => {
  button.onclick = () => {
    selectedCategory = button.dataset.category;
    document.querySelectorAll('.categories button').forEach(other => {
      const selected = other === button;
      other.className = selected ? 'filled' : 'outline';
      other.setAttribute('aria-pressed', selected);
    });
    reset();
  };
});

$('deck').onclick = () => { sound.shuffle(); drawCards(); };
$('row').onclick = event => {
  const button = event.target.closest('.card');
  if (button) openCard(button);
};

$('archiveList').onclick = event => {
  const button = event.target.closest('.archive-item');
  if (!button) return;
  const entry = loadHistory()[+button.dataset.index];
  if (entry) openArchiveEntry(entry);
};

$('again').onclick = () => {
  if (viewingArchive){ showArchiveList(); return; }
  if (count === 1) showToast('今日の一枚は明日まで同じです');
  else showToast('このカテゴリの三枚引きは明日まで同じです');
  reset();
};

$('share').onclick = async () => {
  const title = count === 1 ? '今日の一枚' : 'タロット三枚引き';
  const body = drawn.map(({card, reversed}, i) =>
    `${count === 3 ? POSITIONS[i] + '：' : ''}${card.name}（${reversed ? '逆位置' : '正位置'}）\n${reversed ? card.rev : card.up}`
  ).join('\n\n');
  const text = `${title}\n\n${body}`;

  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); showToast('結果をコピーしました'); }
  } catch {
    showToast('コピーできませんでした');
  }
};

$('sound').onclick = () => {
  const muted = sound.toggleMute();
  $('sound').classList.toggle('muted', muted);
  $('sound').setAttribute('aria-label', muted ? '音を出す' : '音を消す');
  $('waves').hidden = muted;
  $('slash').hidden = !muted;
};

reset();
</script>
</body>
</html>
